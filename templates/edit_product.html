<!DOCTYPE html>
<html>
<head>
    <title>Edit Product - General Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Edit Product</h1>

    <form method="POST">

        <label>Product Name:</label>
        <input type="text" name="product_name" value="{{ product.product_name }}" required>

        <label>Category:</label>
        <input type="text" name="category" value="{{ product.category }}" required>

        <label>Price:</label>
        <input type="number" name="price" step="0.01" min="0" value="{{ product.price }}" required>

        <label>Quantity:</label>
        <input type="number" name="quantity" min="0" value="{{ product.quantity }}" required>

        <label>Minimum Stock Quantity:</label>
        <input type="number" name="min_quantity" min="0" value="{{ product.min_quantity }}" required>

        <button type="submit">Update Product</button>

    </form>

    <br>

    <a href="{{ url_for('products') }}">Back to Products</a>

</body>
</html>
