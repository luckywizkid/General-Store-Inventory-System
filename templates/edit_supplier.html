<!DOCTYPE html>
<html>
<head>
    <title>Edit Supplier - General Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Edit Supplier</h1>

    <form method="POST">

        <label>Supplier Name:</label>
        <input type="text" name="supplier_name" value="{{ supplier.supplier_name }}" required>

        <label>Contact Person:</label>
        <input type="text" name="contact_person" value="{{ supplier.contact_person }}" required>

        <label>Phone Number:</label>
        <input type="tel" name="phone" value="{{ supplier.phone }}" required>

        <label>Email Address:</label>
        <input type="email" name="email" value="{{ supplier.email }}" required>

        <label>Address:</label>
        <input type="text" name="address" value="{{ supplier.address }}" required>

        <button type="submit">Update Supplier</button>

    </form>

    <br>

    <a href="{{ url_for('suppliers') }}">Back to Suppliers</a>

</body>
</html>
