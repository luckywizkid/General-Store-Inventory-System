<!DOCTYPE html>
<html>
<head>
    <title>Customer Feedback - General Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <div class="main-content">

            <div class="page-header">
                <div>
                    <h1>Customer Feedback</h1>
                    <p>We value your feedback. Tell us about your shopping experience.</p>
                </div>

                <a href="{{ url_for('dashboard') }}" class="back-button">
                    Back to Dashboard
                </a>
            </div>

            <div class="dashboard-section">
                <h2>Submit Your Feedback</h2>

                <form method="POST" action="{{ url_for('add_feedback') }}">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Customer Name (Optional):</label>
                            <input type="text" name="customer_name">
                        </div>

                        <div class="form-group">
                            <label>Rating (1–5):</label>
                            <select name="rating" required>
                                <option value="">Select a rating</option>
                                <option value="1">1 - Poor</option>
                                <option value="2">2 - Fair</option>
                                <option value="3">3 - Good</option>
                                <option value="4">4 - Very Good</option>
                                <option value="5">5 - Excellent</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-group">
                        <label>Feedback Message:</label>
                        <textarea name="feedback_message" rows="5" required></textarea>
                    </div>

                    <br>

                    <button type="submit">Submit Feedback</button>

                </form>
            </div>

        </div>
    </div>

</body>
</html>
